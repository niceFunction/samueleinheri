<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prototypes</title>


<!-- GOOGLE FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">


<!-- HEADER CSS -->
<link rel="stylesheet" href="./header.css">

<!-- BACK TO THE TOP -->
<link rel="stylesheet" href="./back-to-the-top.css">

<link rel="stylesheet" href="./prototypes.css">
</head>


<body>

<!-- HEADER LOAD LOCATION -->
<div id="header-placeholder"></div>

<!-- PAGE CONTENT -->

<div class="page-content">

    <!-- ============================================== -->
    <!-- START OF PROTOTYPES CONTENT -->
    <!-- ============================================== -->

    <!-- PARALLAX HERO -->
    <section class="parallax-container">

        <!-- Moving background -->
        <div class="parallax-image"></div>

        <!-- Static text overlay -->
        <div class="parallax-content">

            <h1 class="prototypes-title">
                PROTOTYPES
            </h1>

            <p class="context-text">
                Here's some smaller prototypes I've made for the sake of experimenting & self-improvement. This is to show off my progression as a game developer.
            </p>

        </div>

    </section>

    <!-- ============================================== -->
    <!-- END OF PROTOTYPES CONTENT -->
    <!-- ============================================== -->

    <!-- BACK TO THE TOP BUTTON -->
    <div class="back-to-top-container">

        <button
            id="back-to-top-button"
            class="learn-more-button">

            BACK TO THE TOP

        </button>

    </div>
</div>

<!-- JAVASCRIPT -->
<script src="./reference.js"></script>

<script>
document.body.style.backgroundColor =
SITE_SETTINGS.pageBackground;
</script>

<script src="./header.js"></script>
<script src="./back-to-the-top.js"></script>


<script>

const parallaxImage =
document.querySelector(".parallax-image");

window.addEventListener("scroll", () => {
    const hero = document.querySelector(".parallax-container");
    const rect = hero.getBoundingClientRect();

    const speed = 0.35;
    const offset = rect.top * speed;

    parallaxImage.style.transform = `translateY(${offset}px)`;

});

</script>
</body>
</html>
